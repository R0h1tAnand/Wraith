[package]
name = "wraith"
version = "0.1.0"
edition = "2021"
description = "Secure anonymous messenger built with Rust and Dioxus"

[dependencies]
# UI Framework (mobile = Android/iOS via WebView + JNI)
dioxus = { version = "0.6", features = ["mobile", "router"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
base64 = "0.22"
hex = "0.4"

# Storage
sled = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
zeroize = { version = "1", features = ["derive"] }
dirs = "6.0.0"

[profile.release]
opt-level = 3
lto = true
strip = true
